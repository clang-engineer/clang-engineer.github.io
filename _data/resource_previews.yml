theme_families:
  - id: dracula
    name: Dracula
    description: 어두운 배경에 보라·분홍 계열 강조색을 사용합니다. 에디터와 터미널 등 여러 앱의 색감을 맞출 때 살펴보세요.
    url: https://draculatheme.com/
    icon: https://draculatheme.com/favicon.ico
  - id: catppuccin
    name: Catppuccin
    description: 부드러운 파스텔 계열입니다. 앱·개발 도구·웹사이트용 포트를 제공하며, 여기서는 다크 Mocha와 라이트 Latte를 비교합니다.
    url: https://catppuccin.com/ports/
    icon: https://catppuccin.com/favicon.png
  - id: rose-pine
    name: Rosé Pine
    description: 차분한 장미색·소나무색 계열입니다. 여러 앱과 개발 도구에 적용할 수 있으며, 기본 다크와 라이트 Dawn을 나란히 볼 수 있습니다.
    url: https://rosepinetheme.com/themes/
    icon: https://rosepinetheme.com/favicon.png
  - id: nord
    name: Nord
    description: 청회색·푸른색 계열입니다. 에디터·터미널·라이브러리용 포트에서 사용하는 도구의 지원 여부를 확인하세요.
    url: https://www.nordtheme.com/ports/

# 공통 색상 슬롯은 공식 팔레트의 대표 색상이며 편집기별 구문 강조 규칙과는 다르다.
themes:
  - id: dracula
    name: Dracula
    family: dracula
    variant: 기본
    appearance: dark
    url: https://draculatheme.com/
    source: https://draculatheme.com/spec
    # surface: Selection, blue: ANSI Blue (공식 Purple과 같은 값).
    palette:
      background: '#282a36'
      surface: '#44475a'
      foreground: '#f8f8f2'
      muted: '#6272a4'
      red: '#ff5555'
      green: '#50fa7b'
      yellow: '#f1fa8c'
      blue: '#bd93f9'
      purple: '#bd93f9'
      cyan: '#8be9fd'
  - id: catppuccin-mocha
    name: Catppuccin Mocha
    family: catppuccin
    variant: Mocha
    appearance: dark
    url: https://catppuccin.com/
    source: https://catppuccin.com/palette/
    # background: Base, surface: Surface 0, muted: Subtext 0, purple: Mauve, cyan: Sky.
    palette:
      background: '#1e1e2e'
      surface: '#313244'
      foreground: '#cdd6f4'
      muted: '#a6adc8'
      red: '#f38ba8'
      green: '#a6e3a1'
      yellow: '#f9e2af'
      blue: '#89b4fa'
      purple: '#cba6f7'
      cyan: '#89dceb'
  - id: catppuccin-latte
    name: Catppuccin Latte
    family: catppuccin
    variant: Latte
    appearance: light
    url: https://catppuccin.com/
    source: https://catppuccin.com/palette/
    palette:
      background: '#eff1f5'
      surface: '#ccd0da'
      foreground: '#4c4f69'
      muted: '#6c6f85'
      red: '#d20f39'
      green: '#40a02b'
      yellow: '#df8e1d'
      blue: '#1e66f5'
      purple: '#8839ef'
      cyan: '#04a5e5'
  - id: rose-pine
    name: Rosé Pine
    family: rose-pine
    variant: 기본
    appearance: dark
    url: https://rosepinetheme.com/
    source: https://github.com/rose-pine/rose-pine-palette/blob/main/palette.json
    # 공식 terminal 역할: red Love, green Pine, yellow Gold, blue Foam, purple Iris, cyan Rose.
    palette:
      background: '#191724'
      surface: '#1f1d2e'
      foreground: '#e0def4'
      muted: '#6e6a86'
      red: '#eb6f92'
      green: '#31748f'
      yellow: '#f6c177'
      blue: '#9ccfd8'
      purple: '#c4a7e7'
      cyan: '#ebbcba'
  - id: rose-pine-dawn
    name: Rosé Pine Dawn
    family: rose-pine
    variant: Dawn
    appearance: light
    url: https://rosepinetheme.com/
    source: https://github.com/rose-pine/rose-pine-palette/blob/main/palette.json
    palette:
      background: '#faf4ed'
      surface: '#fffaf3'
      foreground: '#464261'
      muted: '#9893a5'
      red: '#b4637a'
      green: '#286983'
      yellow: '#ea9d34'
      blue: '#56949f'
      purple: '#907aa9'
      cyan: '#d7827e'
  - id: nord
    name: Nord
    appearance: dark
    family: nord
    variant: 기본
    url: https://www.nordtheme.com/
    source: https://www.nordtheme.com/docs/colors-and-palettes
    # background/surface/foreground/muted: nord0/nord1/nord6/nord3; blue/cyan: nord9/nord8.
    palette:
      background: '#2e3440'
      surface: '#3b4252'
      foreground: '#eceff4'
      muted: '#4c566a'
      red: '#bf616a'
      green: '#a3be8c'
      yellow: '#ebcb8b'
      blue: '#81a1c1'
      purple: '#b48ead'
      cyan: '#88c0d0'

fonts:
  - id: jetbrains-mono
    name: JetBrains Mono
    family: JetBrains Mono
    category: 코드용 고정폭
    url: https://fonts.google.com/specimen/JetBrains+Mono
    supports_korean: false
    group: code
    description: 소문자 높이를 키우고 0 안에 점을 넣어 영문·숫자의 형태를 구분하는 코드용 글꼴입니다.
    focus: 0O와 1Il의 구분, 같은 크기에서 소문자가 차지하는 높이를 보세요.
    ligatures: true
    source: https://www.jetbrains.com/lp/mono/
  - id: fira-code
    name: Fira Code
    family: Fira Code
    category: 코드용 고정폭
    url: https://fonts.google.com/specimen/Fira+Code
    supports_korean: false
    group: code
    description: 여러 문자로 된 연산자를 하나의 모양으로 잇는 프로그래밍 합자가 특징입니다. 원본 코드의 문자는 바뀌지 않습니다.
    focus: "!=, !==, =>의 연결 모양과 // 주변의 간격을 보세요."
    ligatures: true
    source: https://github.com/tonsky/FiraCode
  - id: ibm-plex-mono
    name: IBM Plex Mono
    family: IBM Plex Mono
    category: 코드용 고정폭
    url: https://fonts.google.com/specimen/IBM+Plex+Mono
    supports_korean: false
    group: code
    description: 타자기에서 착안한 IBM Plex 계열의 고정폭 글꼴입니다. 글자와 문장부호의 개별 형태를 살펴보세요.
    focus: 합자로 잇지 않은 연산자와 괄호·문장부호의 형태, 코드 한 줄의 밀도를 보세요.
    ligatures: false
    source: https://www.ibm.com/design/language/typography/typeface/
  - id: noto-sans-kr
    name: Noto Sans KR
    family: Noto Sans KR
    category: 한글 산세리프
    url: https://fonts.google.com/specimen/Noto+Sans+KR
    supports_korean: true
    group: text
    description: 한글·한자와 라틴 문자를 지원하는 산세리프입니다. 획 굵기 변화가 적은 형태가 특징입니다.
    focus: 한글의 속공간과 영문·숫자가 섞인 문장의 균형을 보세요. 담백한 본문을 원할 때 비교 기준으로 삼을 수 있습니다.
    source: https://fonts.google.com/noto/specimen/Noto+Sans+KR
  - id: noto-serif-kr
    name: Noto Serif KR
    family: Noto Serif KR
    category: 한글 세리프
    url: https://fonts.google.com/specimen/Noto+Serif+KR
    supports_korean: true
    group: text
    description: 한글·한자와 라틴 문자를 지원하는 세리프입니다. 획 굵기의 변화와 획 끝의 장식이 산세리프와 다릅니다.
    focus: 받침이 많은 글자의 획과 문장 전체의 결을 보세요. 세리프 본문의 인상을 원할 때 Sans와 비교해 고르세요.
    source: https://fonts.google.com/noto/specimen/Noto+Serif+KR

font_stylesheet: 'https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&family=IBM+Plex+Mono:wght@400&family=JetBrains+Mono:wght@400&family=Noto+Sans+KR:wght@400&family=Noto+Serif+KR:wght@400&display=swap'
