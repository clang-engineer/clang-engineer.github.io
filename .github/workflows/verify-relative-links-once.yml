name: Verify relative links once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-relative-links-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair truncated Neovim roadmap tail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('_posts/neovim/2026-06-16-neovim-roadmap.md')
          text = p.read_text(encoding='utf-8')
          broken = '| [플러그인을 Lua로 짤까 Vimscript로 짤까](/posts/neovim/2026-06-12-neovim-plugin'
          if text.rstrip().endswith(broken):
              prefix = text[:text.rfind(broken)]
              tail = '''| [플러그인을 Lua로 짤까 Vimscript로 짤까](./2026-06-12-neovim-plugin-language-choice.md) | 새 플러그인의 기본 선택은 Lua지만 기존 Vimscript 생태계와의 경계도 함께 본다 |
| [Lua와 Vimscript 섞기](./2026-06-12-neovim-plugin-mixing-lua-vimscript.md) | 두 언어를 함께 쓸 때 호출 경계를 최소화하는 법 |
| [플러그인 디렉터리 관례](./2026-06-12-neovim-plugin-conventions.md) | `plugin/`·`lua/`·`autoload/`·`doc/` 등 runtimepath 구조 |
| [플러그인 배포](./2026-06-12-neovim-plugin-distribution.md) | GitHub 공개부터 plugin manager·awesome-neovim 노출까지 |
| [플러그인 테스트](./2026-06-18-neovim-plugin-testing-plenary-minitest-busted.md) | plenary.nvim·mini.test·busted의 역할과 선택 |
| [vimdoc 작성](./2026-06-19-neovim-plugin-vimdoc-panvimdoc.md) | README와 `:help` 문서를 함께 관리하는 방법 |

플러그인 개발은 일반 Neovim 사용의 필수 상위 단계가 아니다. 직접 만들 필요가 없다면 3단계까지로 학습 경로를 닫고, 이 구역은 필요할 때만 들어온다.

## 부록으로 탐색할 것

로드맵의 본 줄기와 별개로 다음 주제는 문제를 만났을 때 해당 문서로 바로 들어간다.

- LSP·DAP·언어별 개발환경
- PKM·Obsidian·Org mode 같은 편집기 활용
- 다른 Editor와의 비교
- 개별 Plugin과 LazyVim Troubleshooting

> **기억할 경계:** Neovim을 잘 쓰는 학습과 Neovim Plugin을 만드는 학습은 같은 사다리의 연속 단계가 아니다. 기본 편집 → 설정 언어 → 배포판 구조까지가 사용자 학습의 주 줄기이고, Plugin 개발은 별도 Branch다.
'''
              p.write_text(prefix + tail, encoding='utf-8')
              print('Repaired truncated Neovim roadmap tail.')
          else:
              print('Neovim roadmap tail did not match the known truncated form; no repair applied.')
          PY

      - name: Verify no Jekyll-only internal links remain
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          files = list(Path('_posts').rglob('*.md')) + [Path('_tabs/roadmap.md')]
          excluded = {Path('_posts/markdown/2026-09-06-markdown-link-syntax.md')}
          pattern = re.compile(r'\]\(/posts/')
          bad = []
          for p in files:
              if p in excluded or not p.exists():
                  continue
              for i, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  if pattern.search(line):
                      bad.append((str(p), i, line.strip()))
          if bad:
              for row in bad:
                  print(f'{row[0]}:{row[1]}: {row[2]}')
              sys.exit(1)
          print('No Jekyll-only Markdown internal links remain.')
          PY

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d _site
        env:
          JEKYLL_ENV: production

      - name: Verify generated links
        run: bundle exec htmlproofer _site --disable-external --ignore-urls '/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/'

      - name: Remove one-time verifier
        run: rm .github/workflows/verify-relative-links-once.yml

      - name: Commit repair and verifier removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/neovim/2026-06-16-neovim-roadmap.md .github/workflows/verify-relative-links-once.yml
          git commit -m "fix: complete relative link migration"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
