name: Final roadmap audit once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-roadmap-audit-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate roadmap files and links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          roadmaps = [
              Path('_posts/terminal/2026-09-05-terminal-roadmap.md'),
              Path('_posts/neovim/2026-06-16-neovim-roadmap.md'),
              Path('_posts/tmux/2026-06-16-tmux-roadmap.md'),
              Path('_posts/shell/2026-07-03-shell-roadmap.md'),
              Path('_posts/shell/2026-07-08-dotfiles-roadmap.md'),
              Path('_posts/macos/2026-07-03-macos-roadmap.md'),
              Path('_posts/linux/2026-07-11-linux-roadmap.md'),
              Path('_posts/keyboard/2026-07-03-keyboard-roadmap.md'),
              Path('_posts/ai/2026-07-03-ai-roadmap.md'),
              Path('_posts/cpp/2026-07-03-cpp-learning-roadmap.md'),
              Path('_posts/go/2026-07-12-go-roadmap.md'),
              Path('_posts/rust/2026-07-12-rust-roadmap.md'),
          ]
          tab = Path('_tabs/roadmap.md')

          missing = [str(p) for p in roadmaps + [tab] if not p.exists()]
          if missing:
              print('Missing files:')
              print('\n'.join(missing))
              sys.exit(1)

          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          broken = []
          count = 0
          for src in [tab] + roadmaps:
              text = src.read_text(encoding='utf-8')
              for dest in link_re.findall(text):
                  dest = dest.strip()
                  if dest.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  clean = dest.split('#', 1)[0].split('?', 1)[0]
                  if not clean.endswith('.md'):
                      continue
                  count += 1
                  target = (src.parent / clean).resolve()
                  if not target.exists():
                      broken.append(f'{src}: {dest}')
          if broken:
              print('Broken Roadmap links:')
              print('\n'.join(broken))
              sys.exit(1)
          print(f'Checked {count} Roadmap Markdown links.')

          tag_re = re.compile(r'^tags\s*:\s*\[(.*)\]\s*$', re.MULTILINE)
          pollution = []
          for p in Path('_posts').rglob('*.md'):
              m = tag_re.search(p.read_text(encoding='utf-8'))
              if not m:
                  continue
              tags = [x.strip().strip('"\'').lower() for x in m.group(1).split(',')]
              if 'roadmap' in tags and 'roadmap' not in p.stem.lower():
                  pollution.append(str(p))
          if pollution:
              print('Roadmap tag on non-roadmap posts:')
              print('\n'.join(pollution))
              sys.exit(1)
          print('Roadmap tag scope clean.')

          bad_body = []
          pattern = re.compile(r'\]\(/posts/')
          excluded = Path('_posts/markdown/2026-09-06-markdown-link-syntax.md')
          for p in list(Path('_posts').rglob('*.md')) + [tab]:
              if p == excluded:
                  continue
              for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  if pattern.search(line):
                      bad_body.append(f'{p}:{n}')
          if bad_body:
              print('Jekyll-only body links remain:')
              print('\n'.join(bad_body))
              sys.exit(1)
          print('Relative-link policy clean.')
          PY

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d _site
        env:
          JEKYLL_ENV: production

      - name: Check generated links
        run: bundle exec htmlproofer _site --disable-external --ignore-urls '/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/'

      - name: Remove audit workflow
        shell: bash
        run: |
          rm .github/workflows/final-roadmap-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/final-roadmap-audit-once.yml
          git commit -m "chore: remove final roadmap audit workflow"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
