name: Renumber technical exam principle sections once

on:
  push:
    paths:
      - '.github/workflows/renumber-tech-exam-principles-once.yml'

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Renumber sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def renumber(path, heading_level):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              prefix = '#' * heading_level
              counter = 0
              pattern = re.compile(rf'(?m)^{re.escape(prefix)} (\d+)\. (.+)$')
              def repl(m):
                  nonlocal counter
                  old = int(m.group(1))
                  if old == 0:
                      return m.group(0)
                  counter += 1
                  return f'{prefix} {counter}. {m.group(2)}'
              text = pattern.sub(repl, text)
              p.write_text(text, encoding='utf-8')

          renumber('_archive/정보관리기술사/개념지도/00-개념지도-공통원칙.md', 2)
          renumber('_archive/정보관리기술사/세부학습/00-세부학습-작성규칙.md', 1)
          PY

      - name: Commit renumbering
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '_archive/정보관리기술사/개념지도/00-개념지도-공통원칙.md' '_archive/정보관리기술사/세부학습/00-세부학습-작성규칙.md'
          git commit -m 'docs: renumber technical exam principle sections'
          git push

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/renumber-tech-exam-principles-once.yml
          git commit -m 'chore: remove one-time renumber workflow'
          git push
