name: Markdown link audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_markdown_links.py'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check_markdown_links.py'

permissions:
  contents: read

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local Markdown links
        # First run is an audit: surface existing broken links without blocking deploys.
        continue-on-error: true
        run: python3 scripts/check_markdown_links.py
