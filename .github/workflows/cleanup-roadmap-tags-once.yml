name: Cleanup roadmap tags once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-roadmap-tags-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove roadmap tag from non-roadmap posts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          tag_re = re.compile(r'^(tags\s*:\s*)\[(.*)\]\s*$', re.MULTILINE)

          for p in Path('_posts').rglob('*.md'):
              if 'roadmap' in p.stem.lower():
                  continue

              text = p.read_text(encoding='utf-8')
              m = tag_re.search(text)
              if not m:
                  continue

              parts = [x.strip() for x in m.group(2).split(',')]
              filtered = [x for x in parts if x.strip('"\'').lower() != 'roadmap']
              if len(filtered) == len(parts):
                  continue

              replacement = m.group(1) + '[' + ', '.join(filtered) + ']'
              new_text = text[:m.start()] + replacement + text[m.end():]
              p.write_text(new_text, encoding='utf-8')
              changed.append(str(p))

          print(f'Changed files: {len(changed)}')
          for p in changed:
              print(' ', p)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/cleanup-roadmap-tags-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts .github/workflows/cleanup-roadmap-tags-once.yml
          git commit -m "refactor: keep roadmap tag on roadmap posts only"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
