name: Refine roadmap readability once

on:
  push:
    paths:
      - '.github/workflows/refine-roadmap-readability-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine Terminal and Linux roadmap readability
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Terminal: keep the core stack sequential, move examples/applications to branches.
          p = Path('_posts/terminal/2026-09-05-terminal-roadmap.md')
          s = p.read_text()
          s = s.replace('| 9. 실제 앱 해부 | 내가 쓰는 앱은 어느 계층에 서 있나? | fzf, btop, lazygit, Yazi, Harlequin, OpenCode |', '| Branch A. 실제 앱 | 실제 앱은 어느 추상화 계층을 선택했나? | fzf, btop, lazygit, Yazi, Harlequin, OpenCode |')
          s = s.replace('| 10. 플랫폼으로서의 TUI | TUI 위에 다시 UI 생태계가 생길 수 있나? | Neovim 내장 TUI, UI protocol, vim.ui, nui, Snacks, LazyVim |', '| Branch B. TUI 플랫폼 | TUI가 다시 상위 UI 플랫폼이 될 수 있나? | Neovim 내장 TUI, UI protocol, vim.ui, nui, Snacks, LazyVim |')
          s = s.replace('| 11. 전체 연결 | tmux와 SSH는 이 스택 어디에 끼나? | 터미널 에뮬레이터 ↔ PTY ↔ 셸/tmux/SSH ↔ 애플리케이션 |', '| Integration. 전체 연결 | tmux와 SSH는 이 스택 어디에 끼나? | 터미널 에뮬레이터 ↔ PTY ↔ 셸/tmux/SSH ↔ 애플리케이션 |')
          s = s.replace('## 9. 실제 애플리케이션을 추상화 계층에 꽂아보기', '## Branch A — 실제 애플리케이션을 추상화 계층에 꽂아보기')
          s = s.replace('## 10. Neovim — TUI가 다시 플랫폼이 되는 사례', '## Branch B — Neovim: TUI가 다시 플랫폼이 되는 사례')
          s = s.replace('## 11. tmux·SSH까지 전체 스택 연결하기', '## Integration — tmux·SSH까지 전체 스택 연결하기')
          marker = '## Branch A — 실제 애플리케이션을 추상화 계층에 꽂아보기'
          if marker in s and '여기까지가 터미널 자체를 이해하는 핵심 스택이다.' not in s:
              s = s.replace(marker, '여기까지가 **터미널 자체를 이해하는 핵심 스택**이다. 아래부터는 이 스택을 실제 앱과 조합에 적용해 보는 선택적 Zoom-in이다.\n\n' + marker)
          p.write_text(s)

          # Linux: preserve the operational flow, shorten catalog-like per-link descriptions.
          p = Path('_posts/linux/2026-07-11-linux-roadmap.md')
          s = p.read_text()
          replacements = {
              './2024-03-23-debian-redhat.md': 'Debian/Red Hat 계열의 Package·운영 차이를 잡는 진입점',
              './2025-01-25-ubuntu-on-windows.md': 'Windows에서 WSL2 기반 Linux 환경을 만드는 진입점',
              './2026-07-11-ssh-server-access-hardening.md': 'SSH 접속과 Key 인증·sshd 기본 보안 경계',
              './2026-06-16-process-find-and-kill.md': 'Process를 이름·포트·Signal 기준으로 찾고 다루기',
              './2026-08-26-top-htop-btop-system-monitoring.md': 'CPU·Memory·Load·Process를 실시간으로 관측하기',
              './2026-07-11-filesystem-disk-management.md': 'Disk 사용량·열린 파일·Mount 문제를 추적하기',
              './2026-07-11-user-account-management.md': 'User·Group·sudo의 기본 계정 관리 흐름',
              './2026-07-11-sudo-su-wheel.md': 'su·sudo·wheel과 권한 상승 경계',
              './2026-07-11-special-permission-bits-suid-sgid-sticky.md': 'SUID·SGID·Sticky Bit의 역할과 보안 의미',
              './2026-07-11-password-policy-pam.md': '비밀번호 정책과 PAM 인증 흐름의 기본 구조',
              './2026-07-11-systemd-service-management.md': 'systemd Unit·start/enable·journal·timer의 서비스 운영 흐름',
              './2026-07-11-syslog-journald-logging.md': 'journald·syslog daemon·Application log의 수집 경로 구분',
              './2026-07-11-login-records-utmp-wtmp.md': '현재·과거 로그인 기록을 감사하는 도구와 데이터',
              './2025-02-19-logrotate.md': '로그 회전·압축·보관의 운영 역할',
          }
          for path, desc in replacements.items():
              pattern = re.compile(r'^(\| \[[^\]]+\]\(' + re.escape(path) + r'\) \|).*(\|)$', re.M)
              s = pattern.sub(r'\1 ' + desc + r' \2', s)
          p.write_text(s)
          PY

      - name: Commit roadmap refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/terminal/2026-09-05-terminal-roadmap.md _posts/linux/2026-07-11-linux-roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: sharpen roadmap big-picture readability"
            git push
          fi

      - name: Remove one-time workflow
        if: always()
        run: |
          git pull --rebase
          git rm .github/workflows/refine-roadmap-readability-once.yml
          git commit -m "chore: remove one-time roadmap readability workflow"
          git push
