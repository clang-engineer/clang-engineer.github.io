name: Refine document principles once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-document-principles-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine documentation principles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # DOCUMENT_TYPES.md
          p = Path('docs/DOCUMENT_TYPES.md')
          text = p.read_text(encoding='utf-8')

          anchor = '문서 유형이 불분명하면 본문을 쓰기 전에 목적을 먼저 좁힌다. 한 글이 여러 유형을 과도하게 섞으면 분리하거나 주 유형을 정하고 나머지는 보조 Section으로 제한한다.\n'
          addition = '\n'.join([
              '',
              '### 이해 가능성이 완전성보다 우선한다',
              '',
              '기술 문서의 최우선 목적은 정보를 빠짐없이 담는 것이 아니라 **독자가 쉽게 이해하고 머릿속에 전체 구조와 관계를 그릴 수 있게 하는 것**이다.',
              '',
              '- 정확한 정보라도 현재 문서의 이해 흐름에 필요하지 않으면 본문에서 줄이거나 하위 문서·Reference로 보낸다.',
              '- 큰 그림만으로 충분한 주제는 그 깊이에서 멈춘다.',
              '- 핵심 원리·동작·경계를 더 이해해야 하는 지점에서만 선택적으로 Zoom-in 한다.',
              '- 세부 정보는 필요할 때 다시 찾을 수 있도록 연결하되, 상위 문서의 흐름을 방해하지 않게 한다.',
              '',
              '> **문서의 품질은 담긴 정보량보다, 읽고 난 뒤 독자의 머릿속에 구조와 관계가 얼마나 선명하게 남는지로 우선 판단한다.**',
              ''
          ])
          if '### 이해 가능성이 완전성보다 우선한다' not in text:
              text = text.replace(anchor, anchor + addition)

          old = '- 개별 개념의 상세 설명보다 **위치·관계·순서**를 우선한다.\n- 단순 목차가 아니라 왜 이 순서로 보는지 드러나야 한다.\n- 영역 전체에서 모든 하위 개념을 펼치지 않는다. 큰 가지와 대표적인 진입점만 남기고 필요한 곳에서 하위 문서로 Zoom-in 한다.\n'
          new = '- 개별 개념의 상세 설명보다 **위치·관계·순서**를 우선한다.\n- **Roadmap은 영역의 모든 내용을 담는 목차나 백과사전이 아니다.** 독자가 큰 그림을 잡는 데 필요한 핵심 축·관계·대표 진입점만 남긴다.\n- 단순 목차가 아니라 왜 이 순서로 보는지 드러나야 한다. 실제 선행관계가 없다면 억지 학습 단계로 만들지 않는다.\n- 영역 전체에서 모든 하위 개념을 펼치지 않는다. 큰 가지와 대표적인 진입점만 남기고 필요한 곳에서 하위 Roadmap이나 상세 문서로 Zoom-in 한다.\n- 한 Roadmap 안에서 서로 다른 거시 관점이 섞여 큰 그림이 흐려지면, 분량이 아니라 **이해 축**을 기준으로 여러 Roadmap으로 나눌 수 있다.\n'
          if old in text:
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          # KNOWLEDGE_ORGANIZATION.md
          p = Path('docs/KNOWLEDGE_ORGANIZATION.md')
          text = p.read_text(encoding='utf-8')
          anchor = '따라서 어떤 영역은 `큰 그림 → 상세 설명`으로 바로 내려갈 수 있고, 다른 영역은 중간에 하나 이상의 관계 지도가 필요할 수 있다.\n'
          addition = '\n'.join([
              '',
              '### 거시 구조와 세부학습의 깊이는 선택적으로 설계한다',
              '',
              '특히 기술사 Knowledge처럼 범위가 넓은 학습 영역에서는 하나의 상위 지도에 모든 내용을 담지 않는다.',
              '',
              '```text',
              '상위 파트 지도',
              '  ↓',
              '한 시야에서 함께 봐야 이해되는 축별 Roadmap',
              '  ↓',
              '필요한 핵심 개념 묶음',
              '  ↓',
              '이해 깊이가 더 필요한 지점만 세부학습',
              '```',
              '',
              '- 어떤 주제는 거시적 위치와 관계만으로 충분할 수 있다.',
              '- 어떤 주제는 원리·동작·경계를 이해하기 위해 세부학습까지 내려가야 한다.',
              '- 모든 주제를 같은 깊이로 상세화하지 않는다.',
              '- 한 파트 안에서도 서로 다른 거시 관점이 있으면 여러 Roadmap으로 나눌 수 있다.',
              '- Roadmap을 나누는 기준은 분량이 아니라 **한 장에서 함께 보았을 때 하나의 큰 그림이 그려지는가**이다.',
              '',
              '> **먼저 구조를 이해하고, 필요한 곳에서만 깊이를 추가한다.**',
              ''
          ])
          if '### 거시 구조와 세부학습의 깊이는 선택적으로 설계한다' not in text:
              text = text.replace(anchor, anchor + addition)

          old = '> **개념 지식은 관계를 따라 탐색할 수 있는 Knowledge 영역에서 체계적으로 관리하고, Blog는 실전 맥락과 경험을 중심으로 유지하되, Markdown과 Git을 정본으로 삼고 공개·열람 도구는 목적에 따라 분리한다.**'
          new = '> **개념 지식은 먼저 큰 그림과 관계를 이해할 수 있게 구성하고, 필요한 지점에서만 선택적으로 세부학습으로 내려간다. Knowledge 영역은 이 관계와 깊이를 따라 탐색할 수 있게 관리하고, Blog는 실전 맥락과 경험을 중심으로 유지하되, Markdown과 Git을 정본으로 삼는다.**'
          if old in text:
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/refine-document-principles-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOCUMENT_TYPES.md docs/KNOWLEDGE_ORGANIZATION.md .github/workflows/refine-document-principles-once.yml
          git commit -m "docs: prioritize understanding and selective zoom-in"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
