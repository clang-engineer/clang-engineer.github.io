name: Cleanup post structure once

on:
  push:
    paths:
      - '.github/workflows/cleanup-post-structure-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove migrated concept stubs and consolidate blog posts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          posts = Path('_posts')
          concept = posts / 'concept'

          # Replace links to migrated concept stubs with their Knowledge source target.
          mapping = {}
          if concept.exists():
              for stub in concept.glob('*.md'):
                  text = stub.read_text()
                  if '공통 개념 정본 이동' not in text and '정본 이동' not in text:
                      continue
                  m = re.search(r'\[[^\]]+\]\((https://github\.com/clang-engineer/clang-engineer\.github\.io/blob/main/_archive/[^)]+)\)', text)
                  if not m:
                      raise SystemExit(f'Knowledge target not found in {stub}')
                  mapping[stub.name] = m.group(1)

          for path in posts.rglob('*.md'):
              if concept in path.parents:
                  continue
              text = path.read_text()
              original = text
              for name, target in mapping.items():
                  text = text.replace(f'../concept/{name}', target)
                  text = text.replace(f'./concept/{name}', target)
              if text != original:
                  path.write_text(text)

          # Delete only confirmed migrated concept stubs.
          for name in mapping:
              (concept / name).unlink()
          if concept.exists() and not any(concept.iterdir()):
              concept.rmdir()

          # Consolidate small blog-authoring folders without adding directory depth.
          blog = posts / 'blog'
          blog.mkdir(exist_ok=True)
          for folder_name in ('jekyll', 'markdown'):
              folder = posts / folder_name
              if not folder.exists():
                  continue
              for src in folder.glob('*.md'):
                  dst = blog / src.name
                  if dst.exists():
                      raise SystemExit(f'destination exists: {dst}')
                  src.rename(dst)
              if not any(folder.iterdir()):
                  folder.rmdir()

          # Update sibling-folder relative references to moved source files.
          for path in posts.rglob('*.md'):
              text = path.read_text()
              updated = text.replace('../jekyll/', '../blog/').replace('../markdown/', '../blog/')
              if updated != text:
                  path.write_text(updated)
          PY

          # Fail if stale concept source links remain.
          if grep -R --include='*.md' -nE '(\.\./|\./)concept/' _posts; then
            echo 'stale concept links remain'
            exit 1
          fi

      - name: Validate Jekyll build
        run: |
          bundle install
          bundle exec jekyll build

      - name: Commit cleanup
        run: |
          git config user.name 'clang.engineer'
          git config user.email 'clang.engineer@gmail.com'
          git add -A
          git commit -m 'docs: simplify post folders and remove migrated stubs'
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/cleanup-post-structure-once.yml
          git commit -m 'chore: remove one-time post cleanup workflow'
          git push
