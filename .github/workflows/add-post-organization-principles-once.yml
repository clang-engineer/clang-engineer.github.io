name: Add post organization principles once
on:
  push:
    paths:
      - .github/workflows/add-post-organization-principles-once.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update principles
        env:
          SCRIPT_B64: 
        run: echo "$SCRIPT_B64" | base64 -d | python
      - name: Commit update
        run: |
          git config user.name clang.engineer
          git config user.email clang.engineer@gmail.com
          git add docs/KNOWLEDGE_ORGANIZATION.md
          git commit -m 'docs: define post folder and filename principles'
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/add-post-organization-principles-once.yml
          git commit -m 'chore: remove one-time post organization workflow'
          git push
