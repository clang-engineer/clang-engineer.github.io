name: Deduplicate technical exam principles once

on:
  push:
    paths:
      - '.github/workflows/dedupe-tech-exam-principles-once.yml'

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicated common-principle sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def remove_sections(path, section_numbers, replacement_after_intro=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for n in section_numbers:
                  pattern = rf'(?ms)^## {n}\. .*?(?=^## \d+\.|\Z)'
                  text, count = re.subn(pattern, '', text, count=1)
                  if count != 1:
                      raise SystemExit(f'expected section ## {n}. in {path}, got {count}')
              if replacement_after_intro:
                  marker, block = replacement_after_intro
                  if block not in text:
                      if marker not in text:
                          raise SystemExit(f'marker not found in {path}: {marker}')
                      text = text.replace(marker, marker + block, 1)
              text = re.sub(r'\n{3,}', '\n\n', text)
              p.write_text(text, encoding='utf-8')

          concept = '_archive/정보관리기술사/개념지도/00-개념지도-공통원칙.md'
          concept_marker = '학습 대상과 A/B/C 우선순위는 `../학습등급표/`에서 정하고, 상세한 동작 원리와 이해 기록은 `../세부학습/`에서 다룬다.\n'
          concept_block = '''\n### 상위 공통 원칙은 반복하지 않는다\n\n개념을 어떤 단위로 묶을지, 실제 관계를 어떻게 표현할지, 인과가 없는 대상을 억지 스토리로 만들지 않는 기준은 저장소 공통 원칙을 그대로 따른다. 이 문서에서는 **개념지도에만 필요한 깊이·인출·학습 경로 규칙**만 추가한다.\n'''
          remove_sections(concept, [2, 4, 5], (concept_marker, concept_block))

          detail = '_archive/정보관리기술사/세부학습/00-세부학습-작성규칙.md'
          detail_marker = '세부학습 문서의 목적은 **시험 직전 암기용 요약본이 아니라, 학습 과정에서 이해한 내용을 나중에 다시 읽었을 때 그 이해가 복원되는 문서**를 만드는 것이다.\n'
          detail_block = '''\n### 상위 공통 원칙은 반복하지 않는다\n\n개념을 함께 묶는 기준, 이해에 결정적이었던 설명을 보존하는 기준, 실제 인과가 있을 때 흐름을 드러내는 기준은 저장소 공통 원칙을 그대로 따른다. 이 문서에서는 **기술사 세부학습에만 필요한 깊이·인출·답안 관점·99 보충학습 규칙**만 추가한다.\n'''
          remove_sections(detail, [2, 3, 4], (detail_marker, detail_block))
          PY

      - name: Commit principle cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '_archive/정보관리기술사/개념지도/00-개념지도-공통원칙.md' '_archive/정보관리기술사/세부학습/00-세부학습-작성규칙.md'
          git commit -m 'docs: deduplicate technical exam principles'
          git push

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/dedupe-tech-exam-principles-once.yml
          git commit -m 'chore: remove one-time principle cleanup workflow'
          git push
