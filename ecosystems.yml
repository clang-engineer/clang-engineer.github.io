viewer:
  default_period: 0
periods: [0, 7, 30, 90]
ecosystems:
  - id: terminal-file-managers
    discovery: topic
    searches:
      - "terminal file manager in:name,description"
      - "tui file manager in:name,description"
      - "console file manager in:name,description"
    name: Terminal File Managers
    source: github
    topic: terminal-file-manager
    limit: 100
    min_stars: 1000
  - id: terminal-emulators
    discovery: topic
    searches:
      - "terminal emulator in:name,description"
      - "gpu accelerated terminal in:name,description"
      - "terminal emulator topic:terminal"
    name: Terminal Emulators
    source: github
    topic: terminal-emulator
    limit: 100
    min_stars: 1000
  - id: terminal-multiplexers
    discovery: topic
    readme_searches:
      - "terminal multiplexer"
    searches:
      - "terminal multiplexer in:name,description"
      - "terminal session multiplexer in:name,description"
      - "topic:multiplexer"
      - "terminal session manager in:name,description"
    name: Terminal Multiplexers
    source: github
    topic: terminal-multiplexer
    limit: 100
    min_stars: 1000
  - id: developer-color-themes
    name: Developer Color Themes
    source: github
    discovery: topic
    topic: colorscheme
    searches:
      - "topic:color-scheme theme in:name,description archived:false"
      - "topic:neovim-colorscheme archived:false"
      - "topic:vscode-theme archived:false"
      - '"color scheme" vim in:description archived:false'
      - '"all platforms" theme in:description archived:false'
    limit: 100
    min_stars: 500
    # Stars belong to repositories. Independently maintained ports can rank separately.
    exclude_patterns:
      - '^awesome-|\bdotfiles?\b|\bpersonal (?:configurations?|configs?|setups?)\b'
      - '\b(?:collection|megapack|curated list|repository) of (?:(?:awesome|Vim|Neovim|terminal) )?(?:themes|color\s*schemes)\b'
      - '\b(?:color\s*schemes|themes) for (?:the )?(?:kitty terminal emulator|default macOS Terminal)\b'
      - '\b(?:theme|palette|color(?:[ -]?scheme)?|LUT)[ -](?:generat(?:or|ion)|designer|manager|switcher)\b'
      - '^(?:create (?:Neovim )?themes|generate colors)|\bapplication for generating\b|\btool (?:for|to) (?:generate|convert)\b'
      - '\b(?:icon[ -]themes?|material design icons|WordPress theme|Flutter package|Neovim framework)\b'
      - '\b(?:over )?\d{2,} (?:terminal )?color\s*schemes\b|^manually ported color themes\b'
      - '\b(?:collection of wallpapers|find your next .{0,20}colou?r\s*s?cheme|design system into an agent plugin)\b'
      - '\b(?:customize .{0,30}system prompts|enable Acrylic|Solidity language support)\b'
  - id: shell-prompts
    name: Shell Prompts
    source: github
    discovery: curated
    repositories:
      - starship/starship
      - JanDeDobbeleer/oh-my-posh
      - romkatv/powerlevel10k
      - spaceship-prompt/spaceship-prompt
      - sindresorhus/pure
      - b-ryan/powerline-shell
      - liquidprompt/liquidprompt
      - justjanne/powerline-go
      - pure-fish/pure
      - IlanCosman/tide
      - jorgebucaran/hydro
      - woefe/git-prompt.zsh
  - id: terminal-effects
    discovery: topic
    # Terminal output effects and screensavers, not browser terminal animations.
    searches:
      # One broader query covers visual/text effects within the collector's five-query limit.
      - "terminal effects in:name,description"
      - "terminal screensaver in:name,description"
      - '"The Matrix" terminal in:name,description'
      - "decryption effect in:description"
      - '"rainbows and unicorns" in:description'
    name: Terminal Effects & Screensavers
    source: github
    limit: 100
    # Keep smaller, focused tools discoverable alongside established projects.
    min_stars: 100
  - id: window-managers
    discovery: topic
    searches:
      - "tiling window manager in:name,description"
      - "dynamic window manager in:name,description"
      - "topic:tiling-window-manager"
    name: Window Managers
    source: github
    topic: window-manager
    limit: 100
    min_stars: 1000
  - id: cli-search-tools
    discovery: topic
    searches:
      - "fuzzy finder in:name,description"
      - "interactive grep in:name,description"
      - "command line fuzzy finder in:description"
      - "source code search in:description"
    name: CLI Search & Navigation
    source: github
    limit: 100
    min_stars: 1000
  - id: neovim-plugins
    discovery: topic
    searches:
      - "neovim plugin in:name,description"
      - "neovim extension in:name,description"
    name: Neovim Plugins
    source: github
    topic: neovim-plugin
    # Managers and plugins with Vim/nvim metadata can miss Neovim-specific searches.
    # https://github.com/junegunn/vim-plug and https://github.com/wbthomason/packer.nvim
    repositories:
      - folke/lazy.nvim
      - junegunn/vim-plug
      - nvim-treesitter/nvim-treesitter
      - lewis6991/pckr.nvim
    limit: 100
    min_stars: 100
  - id: tmux-plugins
    discovery: topic
    searches:
      - "tmux plugin in:name,description"
      - "tmux status bar in:name,description"
      - "tmux session manager in:name,description"
    name: Tmux Plugins
    source: github
    topic: tmux-plugin
    # Reviewed TPM plugins from https://github.com/tmux-plugins/list
    repositories:
      - tmux-plugins/tpm
      - tmux-plugins/tmux-resurrect
      - tmux-plugins/tmux-continuum
      - tmux-plugins/tmux-sensible
      - laktak/extrakto
    limit: 100
    min_stars: 100
  - id: zsh-plugins
    name: Zsh Plugins
    source: github
    discovery: topic
    topic: zsh-plugin
    searches:
      - '"zsh plugin" in:description'
      - '"zsh completion" in:description'
    # Reviewed plugins, frameworks and managers from https://github.com/unixorn/awesome-zsh-plugins
    # Rank bundled frameworks once per repository, not once per included plugin.
    repositories:
      - ohmyzsh/ohmyzsh
      - sorin-ionescu/prezto
      - zsh-users/antigen
      - zplug/zplug
      - zimfw/zimfw
      - zdharma-continuum/zinit
      - mattmc3/antidote
      - marlonrichert/zsh-snap
      - rossmacarthur/sheldon
      - zsh-users/zsh-autosuggestions
      - zsh-users/zsh-syntax-highlighting
      - zsh-users/zsh-completions
      - zsh-users/zsh-history-substring-search
      - Aloxaf/fzf-tab
      - wfxr/forgit
    exclude:
      - unixorn/awesome-zsh-plugins
      - skwp/dotfiles
      - ryanb/dotfiles
    limit: 100
    min_stars: 100
  - id: fish-plugins
    name: Fish Plugins
    source: github
    discovery: topic
    topic: fish-plugin
    searches:
      - '"fish plugin" in:description'
      - '"plugin for fish" in:description'
    # Reviewed plugins and managers from https://github.com/jorgebucaran/awsm.fish
    # OMF calls itself a framework; topic/description plugin searches miss it.
    repositories:
      - oh-my-fish/oh-my-fish
      - jorgebucaran/fisher
      - danhper/fundle
      - justinmayer/virtualfish
      - joseluisq/gitnow
      - PatrickF1/fzf.fish
      - jethrokuan/z
      - jorgebucaran/nvm.fish
      - franciscolourenco/done
      - jorgebucaran/replay.fish
      - edc/bass
      - meaningful-ooo/sponge
      - jorgebucaran/autopair.fish
      - nickeb96/puffer-fish
      - wfxr/forgit
    exclude:
      - jorgebucaran/awsm.fish
      - fish-shell/fish-shell
      - UE4-OceanProject/OceanProject
    limit: 100
    min_stars: 100
  - id: yazi-plugins
    name: Yazi Plugins
    source: github
    discovery: topic
    topic: yazi-plugin
    searches:
      - '"yazi plugin" in:description'
      - '"plugin for yazi" in:description'
    # Reviewed entries from https://yazi-rs.github.io/docs/resources/
    # Rank the official plugin collection once, not once per subdirectory.
    repositories:
      - yazi-rs/plugins
      - Shallow-Seek/fazif.yazi
      - XYenon/yafg.yazi
      - XYenon/clipboard.yazi
      - dedukun/bookmarks.yazi
      - Rolv-Apneseth/starship.yazi
      - ndtoan96/ouch.yazi
      - dedukun/relative-motions.yazi
      - AnirudhG07/rich-preview.yazi
    exclude:
      - sxyazi/yazi
      - yazi-rs/yazi-rs.github.io
      - AnirudhG07/awesome-yazi
      - mikavilpas/yazi.nvim
      - yazi-rs/flavors
      - catppuccin/yazi
    limit: 100
    min_stars: 0
  - id: fzf-ecosystem
    name: fzf Ecosystem
    source: github
    discovery: topic
    topic: fzf
    searches:
      - "fzf in:name,description"
    # Known integrations supplement topic/name discovery (e.g. navi).
    repositories:
      - junegunn/fzf.vim
      - ibhagwan/fzf-lua
      - Aloxaf/fzf-tab
      - PatrickF1/fzf.fish
      - wfxr/forgit
      - bigH/git-fuzzy
      - sainnhe/tmux-fzf
      - junegunn/fzf-git.sh
      - junegunn/everything.fzf
      - denisidoro/navi
      - ajeetdsouza/zoxide
      - Shallow-Seek/fazif.yazi
      - XYenon/yafg.yazi
      # https://github.com/junegunn/fzf/wiki/Related-projects#tmux
      - laktak/extrakto
    # Alternatives and algorithm ports are not integrations of the fzf executable.
    exclude:
      - junegunn/fzf
      - alexpasmantier/television
      - skim-rs/skim
      - lotabout/skim
      - dmtrKovalenko/fff
      - nvim-telescope/telescope-fzf-native.nvim
    limit: 100
    min_stars: 0
  - id: shell-environments
    name: Shells
    source: github
    discovery: curated
    repositories:
      - fish-shell/fish-shell
      - nushell/nushell
      - zsh-users/zsh
      # GNU Bash source mirror for GitHub Stars.
      - tianon/mirror-bash
      - PowerShell/PowerShell
      - xonsh/xonsh
      - elves/elvish
      - oils-for-unix/oils
      - liljencrantz/crush
      - mitnk/cicada
      - michaelmacinnis/oh
      - tcsh-org/tcsh
      - ibara/oksh
  - id: shell-plugins
    name: Shell Plugins
    source: github
    discovery: topic
    searches:
      - "topic:fish-plugin"
      - "topic:zsh-plugin"
      - "topic:nushell-plugin"
      - "topic:bash-plugin"
    limit: 100
    min_stars: 100
    # Supplement topic coverage with known plugins, completions and plugin managers.
    repositories:
      - PatrickF1/fzf.fish
      - jorgebucaran/fisher
      - oh-my-fish/oh-my-fish
      - ohmyzsh/ohmyzsh
      - sorin-ionescu/prezto
      - zplug/zplug
      - zimfw/zimfw
      - zdharma-continuum/zinit
      - mattmc3/antidote
      - marlonrichert/zsh-snap
      - rossmacarthur/sheldon
      - danhper/fundle
      - justinmayer/virtualfish
      - joseluisq/gitnow
      - zsh-users/zsh-autosuggestions
      - zsh-users/zsh-syntax-highlighting
      - zsh-users/zsh-completions
      - zsh-users/antigen
      - nushell/nu_scripts
      - nushell/nupm
      - Bash-it/bash-it
      - ohmybash/oh-my-bash
      - scop/bash-completion
      - akinomyoga/ble.sh
      - gradle/gradle-completion
    # Exclude prompts, resource lists and personal dotfile collections.
    exclude:
      - starship/starship
      - JanDeDobbeleer/oh-my-posh
      - romkatv/powerlevel10k
      - spaceship-prompt/spaceship-prompt
      - sindresorhus/pure
      - b-ryan/powerline-shell
      - liquidprompt/liquidprompt
      - justjanne/powerline-go
      - pure-fish/pure
      - IlanCosman/tide
      - jorgebucaran/hydro
      - woefe/git-prompt.zsh
      - jorgebucaran/awsm.fish
      - unixorn/awesome-zsh-plugins
      - bradp/dotfiles
      - SukkaW/dotfiles
      - laughedelic/fish_logo
  - id: git-tui
    discovery: topic
    searches:
      - "git tui in:name,description"
      - "git client in:name,description"
      - "git diff in:name,description"
      - "git diff pager in:description"
      - "terminal UI in:description git"
    name: Git Tools
    source: github
    topic: git-tools
    limit: 100
    min_stars: 1000
  - id: terminal-system-monitors
    discovery: topic
    searches:
      - "terminal system monitor in:name,description"
      - "terminal process monitor in:description"
      - "tui system monitor in:name,description"
    name: Terminal System Monitors
    source: github
    topic: system-monitor
    limit: 100
    min_stars: 1000
  - id: terminal-editors
    discovery: topic
    searches:
      - "terminal text editor in:name,description"
      - "topic:text-editor topic:c"
      # Older editors can describe their category only in the README.
      - '"real-time display editor" in:readme'
      - "modal text editor in:name,description"
    name: Terminal Editors
    source: github
    topic: terminal-editor
    limit: 100
    min_stars: 1000
  - id: cli-database-clients
    discovery: topic
    searches:
      - "terminal database client in:name,description"
      - "sql cli client in:name,description"
      - "terminal SQL client in:description"
      - "database tui in:name,description"
      - "database terminal in:description"
    name: CLI Database Clients
    source: github
    topic: database-client
    limit: 100
    min_stars: 1000
  - id: container-tui
    discovery: topic
    searches:
      - "docker tui in:name,description"
      - "terminal docker manager in:name,description"
      - "container management tui in:description"
    name: Container TUI
    source: github
    topic: docker-tui
    limit: 100
    min_stars: 1000
  - id: ai-coding-agents
    discovery: topic
    searches:
      - "coding agent in:name,description"
      - "ai coding assistant in:name,description"
      - "agentic coding in:name,description"
      - "terminal ai agent in:name,description"
      - "autonomous coding in:name,description"
    name: AI Coding Agents
    source: github
    topic: coding-agent
    limit: 100
    min_stars: 1000
  - id: ai-agent-ecosystem
    discovery: topic
    searches:
      - "ai agent framework in:name,description"
      - "multi agent orchestration in:name,description"
      - "agent workflow framework in:name,description"
      - "model context protocol in:name,description"
      - "mcp server in:name,description"
    name: AI Agent Ecosystem
    source: github
    topic: ai-agents
    limit: 100
    min_stars: 1000
