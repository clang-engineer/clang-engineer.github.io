viewer:
  default_period: 0
periods: [0, 7, 30, 90]
ecosystems:
  - id: terminal-file-managers
    discovery: topic
    searches:
      - "terminal file manager in:name,description"
      - "tui file manager in:name,description"
      - "console file manager in:name,description"
    name: Terminal File Managers
    source: github
    topic: terminal-file-manager
    limit: 100
    min_stars: 1000
  - id: terminal-emulators
    discovery: topic
    searches:
      - "terminal emulator in:name,description"
      - "gpu accelerated terminal in:name,description"
      - "terminal emulator topic:terminal"
    name: Terminal Emulators
    source: github
    topic: terminal-emulator
    limit: 100
    min_stars: 1000
  - id: terminal-multiplexers
    discovery: topic
    readme_searches:
      - "terminal multiplexer"
    searches:
      - "terminal multiplexer in:name,description"
      - "terminal session multiplexer in:name,description"
      - "topic:multiplexer"
      - "terminal session manager in:name,description"
    name: Terminal Multiplexers
    source: github
    topic: terminal-multiplexer
    limit: 100
    min_stars: 1000
  - id: shell-prompts
    name: Shell Prompts
    source: github
    discovery: curated
    repositories:
      - starship/starship
      - JanDeDobbeleer/oh-my-posh
      - romkatv/powerlevel10k
      - spaceship-prompt/spaceship-prompt
      - sindresorhus/pure
      - b-ryan/powerline-shell
      - liquidprompt/liquidprompt
      - justjanne/powerline-go
      - pure-fish/pure
      - IlanCosman/tide
      - jorgebucaran/hydro
      - woefe/git-prompt.zsh
  - id: window-managers
    discovery: topic
    searches:
      - "tiling window manager in:name,description"
      - "dynamic window manager in:name,description"
      - "topic:tiling-window-manager"
    name: Window Managers
    source: github
    topic: window-manager
    limit: 100
    min_stars: 1000
  - id: cli-search-tools
    discovery: topic
    searches:
      - "fuzzy finder in:name,description"
      - "interactive grep in:name,description"
      - "command line fuzzy finder in:description"
      - "source code search in:description"
    name: CLI Search & Navigation
    source: github
    limit: 100
    min_stars: 1000
  - id: neovim-plugins
    discovery: topic
    searches:
      - "neovim plugin in:name,description"
      - "neovim extension in:name,description"
    name: Neovim Plugins
    source: github
    topic: neovim-plugin
    limit: 100
    min_stars: 100
  - id: tmux-plugins
    discovery: topic
    searches:
      - "tmux plugin in:name,description"
      - "tmux status bar in:name,description"
      - "tmux session manager in:name,description"
    name: Tmux Plugins
    source: github
    topic: tmux-plugin
    limit: 100
    min_stars: 100
  - id: shell-environments
    name: Shells
    source: github
    discovery: curated
    repositories:
      - fish-shell/fish-shell
      - nushell/nushell
      - zsh-users/zsh
      # GNU Bash source mirror for GitHub Stars.
      - tianon/mirror-bash
      - PowerShell/PowerShell
      - xonsh/xonsh
      - elves/elvish
      - oils-for-unix/oils
      - liljencrantz/crush
      - mitnk/cicada
      - michaelmacinnis/oh
      - tcsh-org/tcsh
      - ibara/oksh
  - id: shell-plugins
    name: Shell Plugins
    source: github
    discovery: topic
    searches:
      - "topic:fish-plugin"
      - "topic:zsh-plugin"
      - "topic:nushell-plugin"
      - "topic:bash-plugin"
    limit: 100
    min_stars: 100
    # Supplement topic coverage with known plugins, completions and plugin managers.
    repositories:
      - PatrickF1/fzf.fish
      - jorgebucaran/fisher
      - oh-my-fish/oh-my-fish
      - ohmyzsh/ohmyzsh
      - sorin-ionescu/prezto
      - zsh-users/zsh-autosuggestions
      - zsh-users/zsh-syntax-highlighting
      - zsh-users/zsh-completions
      - zsh-users/antigen
      - nushell/nu_scripts
      - nushell/nupm
      - Bash-it/bash-it
      - ohmybash/oh-my-bash
      - scop/bash-completion
      - akinomyoga/ble.sh
      - gradle/gradle-completion
    # Exclude prompts, resource lists and personal dotfile collections.
    exclude:
      - starship/starship
      - JanDeDobbeleer/oh-my-posh
      - romkatv/powerlevel10k
      - spaceship-prompt/spaceship-prompt
      - sindresorhus/pure
      - b-ryan/powerline-shell
      - liquidprompt/liquidprompt
      - justjanne/powerline-go
      - pure-fish/pure
      - IlanCosman/tide
      - jorgebucaran/hydro
      - woefe/git-prompt.zsh
      - jorgebucaran/awsm.fish
      - unixorn/awesome-zsh-plugins
      - bradp/dotfiles
      - SukkaW/dotfiles
      - laughedelic/fish_logo
  - id: git-tui
    discovery: topic
    searches:
      - "git tui in:name,description"
      - "git client in:name,description"
      - "git diff in:name,description"
      - "git diff pager in:description"
      - "terminal UI in:description git"
    name: Git Tools
    source: github
    topic: git-tools
    limit: 100
    min_stars: 1000
  - id: terminal-system-monitors
    discovery: topic
    searches:
      - "terminal system monitor in:name,description"
      - "terminal process monitor in:description"
      - "tui system monitor in:name,description"
    name: Terminal System Monitors
    source: github
    topic: system-monitor
    limit: 100
    min_stars: 1000
  - id: terminal-editors
    discovery: topic
    searches:
      - "terminal text editor in:name,description"
      - "topic:text-editor topic:c"
      # Older editors can describe their category only in the README.
      - '"real-time display editor" in:readme'
      - "modal text editor in:name,description"
    name: Terminal Editors
    source: github
    topic: terminal-editor
    limit: 100
    min_stars: 1000
  - id: cli-database-clients
    discovery: topic
    searches:
      - "terminal database client in:name,description"
      - "sql cli client in:name,description"
      - "terminal SQL client in:description"
      - "database tui in:name,description"
      - "database terminal in:description"
    name: CLI Database Clients
    source: github
    topic: database-client
    limit: 100
    min_stars: 1000
  - id: container-tui
    discovery: topic
    searches:
      - "docker tui in:name,description"
      - "terminal docker manager in:name,description"
      - "container management tui in:description"
    name: Container TUI
    source: github
    topic: docker-tui
    limit: 100
    min_stars: 1000
  - id: ai-coding-agents
    discovery: topic
    searches:
      - "coding agent in:name,description"
      - "ai coding assistant in:name,description"
      - "agentic coding in:name,description"
      - "terminal ai agent in:name,description"
      - "autonomous coding in:name,description"
    name: AI Coding Agents
    source: github
    topic: coding-agent
    limit: 100
    min_stars: 1000
  - id: ai-agent-ecosystem
    discovery: topic
    searches:
      - "ai agent framework in:name,description"
      - "multi agent orchestration in:name,description"
      - "agent workflow framework in:name,description"
      - "model context protocol in:name,description"
      - "mcp server in:name,description"
    name: AI Agent Ecosystem
    source: github
    topic: ai-agents
    limit: 100
    min_stars: 1000
