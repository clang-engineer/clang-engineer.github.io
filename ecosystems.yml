viewer:
  default_period: 7
periods: [7, 30, 0]
ecosystems:
  - id: terminal-file-managers
    discovery: topic
    searches:
      - "terminal file manager in:name,description"
    name: Terminal File Managers
    source: github
    topic: terminal-file-manager
    limit: 30
  - id: terminal-emulators
    discovery: topic
    searches:
      - "terminal emulator in:name,description"
    name: Terminal Emulators
    source: github
    topic: terminal-emulator
    limit: 30
  - id: neovim-plugins
    discovery: topic
    searches:
      - "neovim plugin in:name,description"
    name: Neovim Plugins
    source: github
    topic: neovim-plugin
    limit: 30
  - id: tmux-plugins
    discovery: topic
    searches:
      - "tmux plugin in:name,description"
    name: tmux Plugins
    source: github
    topic: tmux-plugin
    limit: 100
  - id: terminal-multiplexers
    discovery: topic
    searches:
      - "terminal multiplexer in:name,description"
    name: Terminal Multiplexers
    source: github
    topic: terminal-multiplexer
    limit: 30
  - id: shell-prompts
    discovery: topic
    searches:
      - "shell prompt in:name,description"
    name: Shell Prompts
    source: github
    topic: shell-prompt
    limit: 30
  - id: window-managers
    discovery: topic
    searches:
      - "tiling window manager in:name,description"
    name: Window Managers
    source: github
    topic: window-manager
    limit: 30
  - id: cli-search-tools
    discovery: topic
    searches:
      - "fuzzy finder in:name,description"
    name: CLI Search & Navigation
    source: github
    limit: 30
