viewer:
  default_period: 7
periods: [7, 30, 0]
ecosystems:
  - id: terminal-file-managers
    name: Terminal File Managers
    source: github
    topic: terminal-file-manager
    limit: 30
    repositories:
      - sxyazi/yazi
      - ranger/ranger
      - gokcehan/lf
      - jarun/nnn
      - Canop/broot
  - id: terminal-emulators
    name: Terminal Emulators
    source: github
    topic: terminal-emulator
    limit: 30
    repositories:
      - ghostty-org/ghostty
      - alacritty/alacritty
      - wez/wezterm
      - kovidgoyal/kitty
  - id: neovim-plugins
    name: Neovim Plugins
    source: github
    topic: neovim-plugin
    limit: 30
    repositories:
      - folke/lazy.nvim
      - nvim-telescope/telescope.nvim
      - folke/trouble.nvim
  - id: tmux-plugins
    name: tmux Plugins
    source: github
    topic: tmux-plugin
    limit: 100
    repositories:
      - tmux-plugins/tpm
      - tmux-plugins/tmux-resurrect
      - tmux-plugins/tmux-continuum
      - tmux-plugins/tmux-sensible
      - tmux-plugins/tmux-yank
      - tmux-plugins/tmux-prefix-highlight
      - tmux-plugins/tmux-pain-control
      - tmux-plugins/tmux-copycat
      - tmux-plugins/tmux-open
      - tmux-plugins/tmux-sessionist
      - tmux-plugins/tmux-sidebar
      - tmux-plugins/tmux-battery
      - tmux-plugins/tmux-cpu
      - tmux-plugins/tmux-online-status
      - tmux-plugins/tmux-urlview
      - tmux-plugins/tmux-logging
      - catppuccin/tmux
      - dracula/tmux
      - jimeh/tmux-themepack
      - christoomey/vim-tmux-navigator
      - omerxx/tmux-sessionx
      - laktak/extrakto
      - roosta/tmux-fuzzback
  - id: terminal-multiplexers
    name: Terminal Multiplexers
    source: github
    topic: terminal-multiplexer
    limit: 30
    repositories:
      - tmux/tmux
      - zellij-org/zellij
  - id: shell-prompts
    name: Shell Prompts
    source: github
    topic: shell-prompt
    limit: 30
    repositories:
      - starship/starship
      - romkatv/powerlevel10k
      - ohmyzsh/ohmyzsh
  - id: window-managers
    name: Window Managers
    source: github
    topic: window-manager
    limit: 30
    repositories:
      - nikitabobko/AeroSpace
      - koekeishiya/yabai
      - i3/i3
      - swaywm/sway
  - id: cli-search-tools
    name: CLI Search & Navigation
    source: github
    limit: 30
    repositories:
      - junegunn/fzf
      - ajeetdsouza/zoxide
      - BurntSushi/ripgrep
      - sharkdp/fd
