<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="코딩하는 고양이 앙리">
  <defs>
    <clipPath id="circle">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#f5b722"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#circle)">
    <!-- matrix background -->
    <rect width="240" height="240" fill="#f3fff5"/>
    <g font-family="'Courier New',monospace" font-size="18" font-weight="700" text-anchor="middle">
      <g fill="#8fe6a4">
        <text x="20"  y="30">1</text><text x="20"  y="72">0</text><text x="20" y="150">1</text><text x="20" y="214">0</text>
        <text x="58"  y="18">0</text><text x="58"  y="58">1</text><text x="58" y="196">0</text>
        <text x="120" y="24">1</text><text x="120" y="230">1</text>
        <text x="184" y="20">1</text><text x="184" y="60">0</text><text x="184" y="200">1</text>
        <text x="222" y="34">0</text><text x="222" y="80">1</text><text x="222" y="150">0</text><text x="222" y="212">1</text>
      </g>
      <g fill="#39c95d">
        <text x="20"  y="110">0</text>
        <text x="58"  y="98">1</text><text x="58"  y="160">0</text>
        <text x="90"  y="40">0</text><text x="90"  y="210">1</text>
        <text x="150" y="36">1</text><text x="150" y="206">0</text>
        <text x="184" y="110">0</text><text x="184" y="160">1</text>
        <text x="222" y="112">1</text>
      </g>
    </g>

    <!-- cat -->
    <g>
      <!-- ears -->
      <path d="M80 82 70 50c15 1 26 10 30 24z" fill="url(#cap)"/>
      <path d="M160 82 170 50c-15 1-26 10-30 24z" fill="url(#cap)"/>
      <path d="M84 76 78 60c8 1 14 7 17 15z" fill="#ffb3c1"/>
      <path d="M156 76 162 60c-8 1-14 7-17 15z" fill="#ffb3c1"/>

      <!-- fat round body (behind laptop) -->
      <ellipse cx="120" cy="182" rx="60" ry="42" fill="#fff" stroke="#e9c66a" stroke-width="3"/>

      <!-- chubby head with puffy cheeks -->
      <path d="M120 62C154 62 176 82 175 110C174 138 158 158 120 160C82 158 66 138 65 110C64 82 86 62 120 62Z"
            fill="#fff" stroke="#e9c66a" stroke-width="3"/>

      <!-- golden cap with soft bangs -->
      <path d="M66 112C66 82 88 62 120 62C152 62 174 82 174 112
               C168 106 160 108 156 114C152 106 144 108 140 114
               C135 105 126 108 122 116C118 108 109 105 104 114
               C100 108 92 106 88 114C84 108 76 106 70 112
               C68 112 66 113 66 112Z" fill="url(#cap)"/>

      <!-- eyebrows (worried) -->
      <path d="M96 102c4-3 11-2 15 2M144 102c-4-3-11-2-15 2" fill="none" stroke="#c98a2e" stroke-width="3" stroke-linecap="round"/>

      <!-- eyes -->
      <ellipse cx="103" cy="118" rx="6.5" ry="8.5" fill="#3a3226"/>
      <ellipse cx="137" cy="118" rx="6.5" ry="8.5" fill="#3a3226"/>
      <circle cx="106" cy="114" r="2.6" fill="#fff"/>
      <circle cx="140" cy="114" r="2.6" fill="#fff"/>
      <circle cx="101" cy="121" r="1.3" fill="#fff" opacity="0.8"/>
      <circle cx="135" cy="121" r="1.3" fill="#fff" opacity="0.8"/>

      <!-- chubby cheek blush -->
      <ellipse cx="84" cy="134" rx="11" ry="7" fill="#ffb3c1" opacity="0.6"/>
      <ellipse cx="156" cy="134" rx="11" ry="7" fill="#ffb3c1" opacity="0.6"/>

      <!-- nose + mouth -->
      <path d="M116 128h8l-4 4z" fill="#e79b7a"/>
      <path d="M120 132c-3 4-9 3-10 0M120 132c3 4 9 3 10 0" fill="none" stroke="#c98a2e" stroke-width="2" stroke-linecap="round"/>

      <!-- whiskers -->
      <g stroke="#e9c66a" stroke-width="1.6" stroke-linecap="round">
        <path d="M92 128 70 126M92 134 72 139"/>
        <path d="M148 128 170 126M148 134 168 139"/>
      </g>
    </g>

    <!-- laptop (front) -->
    <g>
      <path d="M84 210l6-34c1-6 6-9 12-9h36c6 0 11 3 12 9l6 34z" fill="#cfd4dc" stroke="#aab0bb" stroke-width="2"/>
      <rect x="70" y="208" width="100" height="12" rx="6" fill="#b8bdc7" stroke="#aab0bb" stroke-width="2"/>
      <!-- logo -->
      <circle cx="120" cy="188" r="9" fill="#ff9db0"/>
      <path d="M120 182c2 2 2 4 0 6M120 182c-2 2-2 4 0 6" fill="none" stroke="#fff" stroke-width="1.6"/>

      <!-- paws on laptop -->
      <ellipse cx="90" cy="180" rx="10" ry="7" fill="#fff" stroke="#e9c66a" stroke-width="2.5"/>
      <ellipse cx="150" cy="180" rx="10" ry="7" fill="#fff" stroke="#e9c66a" stroke-width="2.5"/>
    </g>
  </g>
</svg>
