<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Esc 누르는 고양이</title>
  <desc id="desc">아이보리 HHKB에 비스듬히 기댄 먹색 턱시도 고양이. 한쪽 앞발로 빨간 Esc를 누르고 있으며 왼쪽 Shift는 파란색이다.</desc>
  <defs>
    <clipPath id="avatar"><circle cx="120" cy="120" r="120"/></clipPath>
    <rect id="key" width="10" height="12" rx="2"/>
  </defs>
  <g clip-path="url(#avatar)">
    <path fill="#eee9df" d="M0 0h240v240H0z"/>
    <ellipse cx="122" cy="202" rx="87" ry="9" fill="#d8d2c7"/>

    <!-- Small shoulders behind the keyboard. -->
    <path d="M69 163c-2-32 17-53 49-53s57 20 57 55" fill="#343b40" stroke="#252c31" stroke-width="3.5"/>
    <path d="M102 128l18 11 18-12 12 36H92z" fill="#faf7ef"/>

    <!-- An asymmetric, tilted silhouette rather than a round mascot head. -->
    <g transform="rotate(-9 120 105)" stroke="#252c31" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M57 90 53 48q0-7 7-3l30 19q29-9 57 0l27-24q6-5 8 3l5 47q14 17 10 34c-5 23-38 34-77 33-38-1-66-14-69-35-2-12 0-23 6-32Z" fill="#343b40"/>
      <path d="m63 57 4 26 15-11Z" fill="#bb9188" stroke="none"/>
      <path d="m175 53-18 20 22 7Z" fill="#bb9188" stroke="none"/>
      <!-- A white muzzle and off-centre blaze are the tuxedo markings. -->
      <path d="M58 121q25 6 45-3l16-26 10 28q27 16 60 0c-5 19-33 31-69 30-31-1-54-10-62-29Z" fill="#faf7ef" stroke="none"/>
      <!-- Flat lids and low pupils give a sleepy, unimpressed expression. -->
      <path d="M73 96h29v7q-2 12-14 10-13-1-15-17ZM139 96h29q-2 17-15 17-12-1-14-10Z" fill="#e6dbaf" stroke="none"/>
      <path d="M91 99v8m61-8v8" stroke-width="6"/>
      <path d="m72 95 31 3m35 0 31-3"/>
      <path d="m114 124 10 1-5 5Z" fill="#bb9188" stroke="none"/>
      <path d="m119 130-1 5 7 2" fill="none" stroke-width="2.5"/>
      <path d="m68 123-24-4m24 12-23 3m128-10 24-5m-24 12 22 3" fill="none" stroke-width="2.5"/>
    </g>

    <!-- HHKB-like 60% layout: split backspace, Control at home row,
         no arrow cluster, short right Shift, and a sparse bottom row. -->
    <g stroke-linejoin="round">
      <path d="M32 146h177l5 48q0 8-8 8H34q-8 0-7-8Z" fill="#bdbbb2" stroke="#343b40" stroke-width="3"/>
      <rect x="30" y="143" width="180" height="54" rx="5" fill="#eeeae0" stroke="#343b40" stroke-width="3"/>
      <g fill="#faf8f2" stroke="#c3c0b6" stroke-width=".8">
        <use href="#key" x="47" y="149"/><use href="#key" x="59" y="149"/>
        <use href="#key" x="71" y="149"/><use href="#key" x="83" y="149"/>
        <use href="#key" x="95" y="149"/><use href="#key" x="107" y="149"/>
        <use href="#key" x="119" y="149"/><use href="#key" x="131" y="149"/>
        <use href="#key" x="143" y="149"/><use href="#key" x="155" y="149"/>
        <use href="#key" x="167" y="149"/><use href="#key" x="179" y="149"/>
        <rect x="191" y="149" width="13" height="12" rx="2"/>
        <rect x="36" y="164" width="19" height="11" rx="2"/>
        <rect x="57" y="164" width="12" height="11" rx="2"/>
        <rect x="71" y="164" width="12" height="11" rx="2"/>
        <rect x="85" y="164" width="12" height="11" rx="2"/>
        <rect x="99" y="164" width="12" height="11" rx="2"/>
        <rect x="113" y="164" width="12" height="11" rx="2"/>
        <rect x="127" y="164" width="12" height="11" rx="2"/>
        <rect x="141" y="164" width="12" height="11" rx="2"/>
        <rect x="155" y="164" width="12" height="11" rx="2"/>
        <rect x="169" y="164" width="12" height="11" rx="2"/>
        <rect x="183" y="164" width="21" height="11" rx="2"/>
        <rect x="61" y="178" width="12" height="8" rx="2"/>
        <rect x="75" y="178" width="12" height="8" rx="2"/>
        <rect x="89" y="178" width="12" height="8" rx="2"/>
        <rect x="103" y="178" width="12" height="8" rx="2"/>
        <rect x="117" y="178" width="12" height="8" rx="2"/>
        <rect x="131" y="178" width="12" height="8" rx="2"/>
        <rect x="145" y="178" width="12" height="8" rx="2"/>
        <rect x="159" y="178" width="12" height="8" rx="2"/>
        <rect x="173" y="178" width="17" height="8" rx="2"/>
        <rect x="192" y="178" width="12" height="8" rx="2"/>
        <rect x="57" y="189" width="12" height="5" rx="1.5"/>
        <rect x="72" y="189" width="15" height="5" rx="1.5"/>
        <rect x="90" y="189" width="65" height="5" rx="1.5"/>
        <rect x="158" y="189" width="15" height="5" rx="1.5"/>
        <rect x="176" y="189" width="12" height="5" rx="1.5"/>
      </g>
      <rect x="35" y="151" width="10" height="10" rx="2" fill="#d95d50"/>
      <rect x="36" y="178" width="23" height="8" rx="2" fill="#527fa8"/>
    </g>

    <!-- White mittens: the left paw reaches for Escape. -->
    <g fill="#faf7ef" stroke="#252c31" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M72 131q-16-3-25 6-10 9-12 15-2 6 5 7 7 1 11-6l14-7"/>
      <path d="m43 151-3 5m9-6-3 6" fill="none" stroke-width="1.5"/>
      <path d="M160 139q6-4 14-1 11 4 12 12 1 9-10 10-17 2-21-8"/>
      <path d="m170 152 1 5m6-5 1 5" fill="none" stroke-width="1.5"/>
    </g>
  </g>
</svg>
