<style>
  reference-explorer { display: block; width: 100%; }
  body:has(.dk-app) #main-wrapper > .container { max-width: none; }

  @container devkit (max-width: 1000px) {
    #devkit-root .dk-app:not(.is-expanded) .dk-viewport { height: auto; min-height: 0; }

    #devkit-root .dk-app:not(.is-expanded) .dk-panel-host > .dk-detail { max-height: none; }

  body:has(.dk-app) .dk-app .dk-edge.is-complement .dk-edge-line,
